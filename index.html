<header>
  <h1>Capital Allocation Copilot: Tallwater Software, Inc.</h1>
  <p><strong>Fictional company, for demonstration.</strong> All numbers are made up.</p>

<pre id="test-output" hidden></pre>

<!-- ===================================================================== -->
<!-- ENGINE: pure functions only. Implements SPEC.md. No DOM access here.  -->
<!-- ===================================================================== -->
<script id="engine">
(function (global) {
  'use strict';

  var CHECK_COUNT = 16;
  var TOL_DOLLAR = 0.01;
  var TOL_COUNT = 1e-6;
  var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var PL_LINES = ['cogs', 'rd', 'sm', 'ga'];
  var RATE_DRIVERS = { leadToMqlRate: 1, mqlToOppRate: 1, winRate: 1, churnRateMonthly: 1, expansionRateMonthly: 1, contractionRateMonthly: 1 };
  var CHANNEL_DRIVERS = { costPerLead: 1, leadToMqlRate: 1, mqlToOppRate: 1, winRate: 1, acv: 1 };
  var GLOBAL_DRIVERS = { churnRateMonthly: 1, expansionRateMonthly: 1, contractionRateMonthly: 1, hostingCostPerCustomerPerMonth: 1 };

  // ---------------------------------------------------------------------
  // Default assumptions (SPEC.md section 1). One object holds every input.
  // ---------------------------------------------------------------------
  function defaultAssumptions() {
    var weights = [];
    for (var i = 0; i < 12; i++) weights.push((89 + 2 * i) / 1200);
    function role(department, plLine, openingCount, loadedCostAnnual) {
      return { department: department, plLine: plLine, openingCount: openingCount, loadedCostAnnual: loadedCostAnnual };
    }
    function hire(month, r) { return { month: month, role: r }; }
    return {
      companyName: 'Tallwater Software, Inc. (fictional)',
      startYear: 2027,
      startMonth: 1,
      horizonMonths: 36,
      currency: 'USD',

      openingArr: 24000000,
      openingCustomers: 600,
      churnRateMonthly: 0.0060,
      contractionRateMonthly: 0.0027,
      expansionRateMonthly: 0.0167,

      channelOrder: ['outbound', 'paid', 'events', 'partners'],
      channels: {
        outbound: { name: 'Outbound (SDR to AE)', leadSource: 'sdr', aeSelfSourced: true, programSpendMonthly: 28000, costPerLead: null,
          leadToMqlRate: 0.20, mqlToOppRate: 0.30, winRate: 0.24, salesCycleMonths: 4, acv: 45000, openingPipelineOppsPerMonth: 13.5 },
        paid: { name: 'Paid digital', leadSource: 'spend', aeSelfSourced: false, programSpendMonthly: 60000, costPerLead: 240,
          leadToMqlRate: 0.20, mqlToOppRate: 0.15, winRate: 0.18, salesCycleMonths: 2, acv: 30000, openingPipelineOppsPerMonth: 7.5 },
        events: { name: 'Events and trade shows', leadSource: 'spend', aeSelfSourced: false, programSpendMonthly: 28000, costPerLead: 350,
          leadToMqlRate: 0.25, mqlToOppRate: 0.20, winRate: 0.25, salesCycleMonths: 5, acv: 52000, openingPipelineOppsPerMonth: 4.0 },
        partners: { name: 'Partners and referrals', leadSource: 'spend', aeSelfSourced: false, programSpendMonthly: 24000, costPerLead: 600,
          leadToMqlRate: 0.45, mqlToOppRate: 0.25, winRate: 0.30, salesCycleMonths: 3, acv: 38000, openingPipelineOppsPerMonth: 4.5 }
      },

      leadsPerSdrPerMonth: 25,
      selfSourcedOppsPerAePerMonth: 1.5,
      oppCapacityPerAePerMonth: 7,
      aeRampMonths: 4,
      sdrRampMonths: 2,
      commissionRate: 0.10,

      roles: {
        engineer: role('R&D', 'rd', 41, 215000),
        product_design: role('R&D', 'rd', 9, 200000),
        rd_leader: role('R&D', 'rd', 4, 300000),
        ae: role('Sales', 'sm', 6, 150000),
        sdr: role('Sales', 'sm', 3, 95000),
        sales_engineer: role('Sales', 'sm', 3, 190000),
        sales_leader_ops: role('Sales', 'sm', 4, 230000),
        marketer: role('Marketing', 'sm', 11, 165000),
        support_agent: role('Customer Success', 'cogs', 16, 90000),
        onboarding_specialist: role('Customer Success', 'cogs', 7, 115000),
        csm: role('Customer Success', 'sm', 15, 140000),
        ga_staff: role('G&A', 'ga', 17, 165000),
        executive: role('G&A', 'ga', 4, 380000)
      },
      plannedHires: [
        hire(3, 'support_agent'), hire(4, 'engineer'), hire(6, 'onboarding_specialist'), hire(7, 'sdr'),
        hire(8, 'csm'), hire(9, 'support_agent'), hire(10, 'engineer'), hire(11, 'ga_staff'),
        hire(13, 'ae'), hire(13, 'engineer'), hire(14, 'support_agent'), hire(15, 'engineer'),
        hire(16, 'marketer'), hire(17, 'csm'), hire(18, 'support_agent'), hire(19, 'onboarding_specialist'),
        hire(20, 'engineer'), hire(21, 'product_design'), hire(22, 'support_agent'), hire(23, 'ga_staff'),
        hire(25, 'ae'), hire(25, 'engineer'), hire(26, 'support_agent'), hire(27, 'engineer'),
        hire(28, 'sdr'), hire(29, 'csm'), hire(30, 'support_agent'), hire(31, 'onboarding_specialist'),
        hire(32, 'engineer'), hire(33, 'marketer'), hire(34, 'support_agent'), hire(35, 'ga_staff')
      ],

      hostingCostPerCustomerPerMonth: 360,
      hostingCostGrowthAnnual: 0.05,
      thirdPartyPctOfRevenue: 0.04,

      nonHeadcountMonthly: { rd: 170000, sm: 130000, ga: 300000 },
      costInflationAnnual: 0.03,
      meritIncreaseAnnual: 0.03,
      programSpendGrowthAnnual: 0.05,

      annualBillingShare: 0.60,
      openingInvoiceWeights: weights,
      dsoDays: 45,
      dpoDays: 30,
      openingMonthlyBillings: 2120000,
      openingMonthlyVendorSpend: 1040000,

      capexMonthly: 40000,
      usefulLifeMonths: 36,
      openingPpeRemainingLifeMonths: 24,

      debtInterestRateAnnual: 0.11,
      debtAmortStartMonth: 43,
      debtAmortMonths: 18,
      minCashCovenant: 12000000,
      cashFloor: 15000000,
      cashYieldAnnual: 0.04,

      taxRate: 0.25,
      openingNol: 70000000,

      opening: {
        cash: 38000000,
        accountsReceivable: 3180000,
        prepaidAndOther: 850000,
        ppeNet: 1080000,
        accountsPayable: 1040000,
        accruedLiabilities: 1300000,
        ventureDebt: 10000000,
        paidInCapital: 96000000
      },

      milestones: {
        hosting_optimization: { name: 'Hosting cost optimization', owner: 'VP Infrastructure', shipMonth: 9, teamSize: 5, rampMonths: 3,
          effects: { hostingCostReduction: 0.20 }, enabled: true },
        integrations_hub: { name: 'Enterprise integrations hub', owner: 'VP Product', shipMonth: 12, teamSize: 8, rampMonths: 6,
          effects: { winRateLift: 0.08, acvLift: 0.05 }, enabled: true },
        offline_mobile: { name: 'Offline mobile crew app', owner: 'VP Engineering', shipMonth: 18, teamSize: 6, rampMonths: 6,
          effects: { churnReduction: 0.15 }, enabled: true }
      },

      discountRateAnnual: 0.12,
      objective: { arrTarget: 31200000, month: 12 },
      guardrails: {
        cashFloor: 15000000,
        minRunwayMonths: 18,
        maxBlendedCacPaybackMonths: 24,
        maxBurnMultiple: 2.0,
        minGrossMargin: 0.72
      },

      uncertainty: {
        costPerLead: { low: 0.85, mode: 1.00, high: 1.30, drawn: 'channel' },
        leadToMqlRate: { low: 0.80, mode: 1.00, high: 1.20, drawn: 'channel' },
        mqlToOppRate: { low: 0.80, mode: 1.00, high: 1.20, drawn: 'channel' },
        winRate: { low: 0.75, mode: 1.00, high: 1.25, drawn: 'channel' },
        acv: { low: 0.85, mode: 1.00, high: 1.15, drawn: 'channel' },
        directLeads: { low: 0.70, mode: 1.00, high: 1.20, drawn: 'initiative' },
        milestoneEffect: { low: 0.50, mode: 1.00, high: 1.25, drawn: 'milestone' },
        salesCycleShift: [{ shift: -1, p: 0.15 }, { shift: 0, p: 0.55 }, { shift: 1, p: 0.20 }, { shift: 2, p: 0.10 }]
      },
      simulation: { seed: 2027, runs: 1000 },

      templates: {
        tradeShow: { month: 4, booth: 48000, travel: 12000, staffDays: 20, dayCost: 800, expectedLeads: 200, channel: 'events' },
        hireSdrs: { count: 2, startMonth: 2, loadedCostAnnual: 95000, rampMonths: 2, recruitingEach: 8000, toolsPerSdrMonthly: 1500 },
        hireAes: { count: 2, startMonth: 2, loadedCostAnnual: 150000, rampMonths: 4, recruitingEach: 15000 },
        paidCampaign: { channel: 'paid', budget: 90000, months: 3, startMonth: 2, cplMultiplier: 1.20 },
        partnerProgram: { setup: 40000, setupMonth: 2, coMarketingMonthly: 10000, months: 12, startMonth: 3 }
      }
    };
  }

  // Which inputs are fictional opening facts ("Actual"). Everything else is an "Assumption".
  var ACTUAL_PATTERNS = [
    /^companyName$/, /^startYear$/, /^startMonth$/, /^currency$/, /^openingArr$/, /^openingCustomers$/,
    /^channels\.[^.]+\.openingPipelineOppsPerMonth$/, /^roles\./, /^openingInvoiceWeights/, /^openingMonthlyBillings$/,
    /^openingMonthlyVendorSpend$/, /^openingPpeRemainingLifeMonths$/, /^opening\./, /^debtInterestRateAnnual$/,
    /^debtAmortStartMonth$/, /^debtAmortMonths$/, /^minCashCovenant$/, /^openingNol$/
  ];
  function assumptionType(path) {
    for (var i = 0; i < ACTUAL_PATTERNS.length; i++) if (ACTUAL_PATTERNS[i].test(path)) return 'Actual';
    return 'Assumption';
  }

  // ---------------------------------------------------------------------
  // Notation helpers (SPEC.md section 0)
  // ---------------------------------------------------------------------
  function yearIndex(m) { return Math.floor((m - 1) / 12); }
  function step(g, m) { return Math.pow(1 + g, yearIndex(m)); }
  function ramp(k, R) {
    if (R === 0) return k >= 0 ? 1 : 0;
    return Math.min(1, Math.max(0, k / R));
  }
  function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
  function clone(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function zeros(n) { var a = new Array(n); for (var i = 0; i < n; i++) a[i] = 0; return a; }
  function monthLabel(A, m) {
    var idx = (A.startMonth - 1) + (m - 1);
    var year = A.startYear + Math.floor(idx / 12);
    var mi = ((idx % 12) + 12) % 12;
    return MONTH_NAMES[mi] + ' ' + year;
  }
  function daysInMonth(A, m) {
    var idx = (A.startMonth - 1) + (m - 1);
    var year = A.startYear + Math.floor(idx / 12);
    var mi = ((idx % 12) + 12) % 12;
    return new Date(Date.UTC(year, mi + 1, 0)).getUTCDate();
  }

  // Tax on one month (SPEC.md 2.10)
  function computeTax(preTaxIncome, nolOpening, taxRate) {
    if (preTaxIncome <= 0) return { tax: 0, nol: nolOpening - preTaxIncome };
    var used = Math.min(preTaxIncome, nolOpening);
    return { tax: taxRate * (preTaxIncome - used), nol: nolOpening - used };
  }

  // ---------------------------------------------------------------------
  // Initiative effects -> driver inputs (SPEC.md 2.16)
  // ---------------------------------------------------------------------
  function eachMonth(byMonth, H, fn) {
    if (!byMonth) return;
    Object.keys(byMonth).forEach(function (k) {
      var m = Number(k);
      var v = Number(byMonth[k]);
      if (m >= 1 && m <= H && Math.floor(m) === m && isFinite(v)) fn(m, v);
    });
  }

  function collectEffects(A, initiatives, H) {
    var fx = {
      progSpend: {}, progSpendLeadBasis: {}, directLeads: {},
      hires: [], vendor: {}, allocated: zeros(H + 1), capex: zeros(H + 1), drivers: []
    };
    A.channelOrder.forEach(function (c) {
      fx.progSpend[c] = zeros(H + 1);
      fx.progSpendLeadBasis[c] = zeros(H + 1);
      fx.directLeads[c] = zeros(H + 1);
    });
    PL_LINES.forEach(function (l) { fx.vendor[l] = zeros(H + 1); });

    (initiatives || []).forEach(function (init) {
      (init.effects || []).forEach(function (e) {
        switch (e.kind) {
          case 'program_spend': {
            if (!fx.progSpend[e.channel]) throw new Error('program_spend: unknown channel ' + e.channel);
            var mult = e.cplMultiplier == null ? 1 : e.cplMultiplier;
            eachMonth(e.byMonth, H, function (m, v) {
              fx.progSpend[e.channel][m] += v;
              if (e.leads === 'from_cpl' && mult > 0) fx.progSpendLeadBasis[e.channel][m] += v / mult;
            });
            break;
          }
          case 'direct_leads':
            if (!fx.directLeads[e.channel]) throw new Error('direct_leads: unknown channel ' + e.channel);
            eachMonth(e.byMonth, H, function (m, v) { fx.directLeads[e.channel][m] += v; });
            break;
          case 'headcount': {
            var r = A.roles[e.role];
            if (!r) throw new Error('headcount: unknown role ' + e.role);
            fx.hires.push({
              role: e.role,
              count: e.count || 0,
              start: e.startMonth,
              end: e.endMonth == null ? H : e.endMonth,
              cost: e.loadedCostAnnual == null ? r.loadedCostAnnual : e.loadedCostAnnual,
              initiativeId: init.id
            });
            break;
          }
          case 'vendor_cost':
            if (!fx.vendor[e.line]) throw new Error('vendor_cost: unknown line ' + e.line);
            eachMonth(e.byMonth, H, function (m, v) { fx.vendor[e.line][m] += v; });
            break;
          case 'allocated_cost':
            eachMonth(e.byMonth, H, function (m, v) { fx.allocated[m] += v; });
            break;
          case 'capex':
            eachMonth(e.byMonth, H, function (m, v) { fx.capex[m] += v; });
            break;
          case 'driver_change':
            if (!CHANNEL_DRIVERS[e.driver] && !GLOBAL_DRIVERS[e.driver]) throw new Error('driver_change: unknown driver ' + e.driver);
            fx.drivers.push({
              driver: e.driver,
              channel: e.channel == null ? null : e.channel,
              fromMonth: e.fromMonth == null ? 1 : e.fromMonth,
              toMonth: e.toMonth == null ? H : e.toMonth,
              mode: e.mode === 'add' ? 'add' : 'multiply',
              value: Number(e.value)
            });
            break;
          case 'milestone_shift':
            break; // reserved: defined with product acceleration in a later phase
          default:
            throw new Error('Unknown effect kind: ' + e.kind);
        }
      });
    });
    return fx;
  }

  // value = base x (product of multipliers) + (sum of adds), then clamped (SPEC.md 2.16 rule 1)
  function driverValue(base, driver, channel, m, changes) {
    if (base == null) return null;
    var mult = 1, add = 0;
    for (var i = 0; i < changes.length; i++) {
      var d = changes[i];
      if (d.driver !== driver) continue;
      if (CHANNEL_DRIVERS[driver] && d.channel != null && d.channel !== channel) continue;
      if (m < d.fromMonth || m > d.toMonth) continue;
      if (d.mode === 'add') add += d.value; else mult *= d.value;
    }
    var v = base * mult + add;
    return RATE_DRIVERS[driver] ? clamp(v, 0, 1) : Math.max(0, v);
  }

  function milestoneShares(A, m) {
    var out = { winRateLift: 0, acvLift: 0, churnReduction: 0, hostingCostReduction: 0 };
    Object.keys(A.milestones || {}).forEach(function (id) {
      var ms = A.milestones[id];
      if (!ms.enabled) return;
      var s = ramp(m - ms.shipMonth, ms.rampMonths);
      var e = ms.effects || {};
      out.winRateLift += (e.winRateLift || 0) * s;
      out.acvLift += (e.acvLift || 0) * s;
      out.churnReduction += (e.churnReduction || 0) * s;
      out.hostingCostReduction += (e.hostingCostReduction || 0) * s;
    });
    return out;
  }

  // ---------------------------------------------------------------------
  // The monthly model (SPEC.md 2.1 to 2.13)
  // ---------------------------------------------------------------------
  function runModel(assumptionsIn, initiativesIn) {
    var A = clone(assumptionsIn);
    var inits = clone(initiativesIn || []);
    var H = A.horizonMonths;
    var N = H + 1;
    var fx = collectEffects(A, inits, H);
    var chs = A.channelOrder;
    var roleIds = Object.keys(A.roles);
    var m, c, r, j;

    // --- 2.2 Headcount and payroll ---
    var allHires = A.plannedHires.map(function (h) {
      return { role: h.role, count: 1, start: h.month, end: H, cost: A.roles[h.role].loadedCostAnnual, planned: true };
    }).concat(fx.hires.map(function (h) { h.planned = false; return h; }));
    function active(h, mm) { return h.start <= mm && mm <= h.end; }

    var headcount = { byRole: {}, byDepartment: {}, total: zeros(N) };
    var payroll = { byRole: {}, byLine: {}, total: zeros(N), initiative: zeros(N) };
    PL_LINES.forEach(function (l) { payroll.byLine[l] = zeros(N); });
    roleIds.forEach(function (rid) {
      var dept = A.roles[rid].department;
      if (!headcount.byDepartment[dept]) headcount.byDepartment[dept] = zeros(N);
    });
    roleIds.forEach(function (rid) {
      var R0 = A.roles[rid];
      headcount.byRole[rid] = zeros(N);
      payroll.byRole[rid] = zeros(N);
      for (var mm = 0; mm <= H; mm++) {
        var count = R0.openingCount;
        var annual = R0.openingCount * R0.loadedCostAnnual;
        var initAnnual = 0;
        allHires.forEach(function (h) {
          if (h.role !== rid || !active(h, mm)) return;
          count += h.count;
          if (h.planned) annual += h.count * R0.loadedCostAnnual;
          else initAnnual += h.count * h.cost;
        });
        headcount.byRole[rid][mm] = count;
        headcount.byDepartment[R0.department][mm] += count;
        headcount.total[mm] += count;
        if (mm >= 1) {
          var st = step(A.meritIncreaseAnnual, mm);
          var p = (annual + initAnnual) / 12 * st;
          payroll.byRole[rid][mm] = p;
          payroll.byLine[R0.plLine][mm] += p;
          payroll.total[mm] += p;
          payroll.initiative[mm] += initAnnual / 12 * st;
        }
      }
    });

    var rampedAE = zeros(N), rampedSDR = zeros(N);
    for (m = 1; m <= H; m++) {
      var ae = A.roles.ae ? A.roles.ae.openingCount : 0;
      var sdr = A.roles.sdr ? A.roles.sdr.openingCount : 0;
      allHires.forEach(function (h) {
        if (!active(h, m)) return;
        if (h.role === 'ae') ae += h.count * ramp(m - h.start, A.aeRampMonths);
        if (h.role === 'sdr') sdr += h.count * ramp(m - h.start, A.sdrRampMonths);
      });
      rampedAE[m] = ae;
      rampedSDR[m] = sdr;
    }

    // --- 2.3 Funnel, capacity and timing ---
    var funnel = {};
    chs.forEach(function (cid) {
      funnel[cid] = {
        baseSpend: zeros(N), spend: zeros(N), costPerLead: zeros(N), leads: zeros(N), mql: zeros(N),
        sourcedOpps: zeros(N), aeOpps: zeros(N), oppsCreated: zeros(N), oppsWorked: zeros(N),
        winRate: zeros(N), acv: zeros(N), deals: zeros(N), newArr: zeros(N)
      };
    });
    var capacity = { rampedAE: rampedAE, rampedSDR: rampedSDR, capacity: zeros(N), totalCreated: zeros(N), workShare: zeros(N), utilization: zeros(N) };

    for (m = 1; m <= H; m++) {
      var totalCreated = 0;
      chs.forEach(function (cid) {
        var ch = A.channels[cid], F = funnel[cid];
        var base = ch.programSpendMonthly * step(A.programSpendGrowthAnnual, m);
        F.baseSpend[m] = base;
        F.spend[m] = base + fx.progSpend[cid][m];
        var leads;
        if (ch.leadSource === 'sdr') {
          F.costPerLead[m] = null;
          leads = rampedSDR[m] * A.leadsPerSdrPerMonth + fx.directLeads[cid][m];
        } else {
          var cpl = driverValue(ch.costPerLead, 'costPerLead', cid, m, fx.drivers);
          F.costPerLead[m] = cpl;
          leads = (cpl > 0 ? base / cpl + fx.progSpendLeadBasis[cid][m] / cpl : 0) + fx.directLeads[cid][m];
        }
        F.leads[m] = leads;
        F.mql[m] = leads * driverValue(ch.leadToMqlRate, 'leadToMqlRate', cid, m, fx.drivers);
        F.sourcedOpps[m] = F.mql[m] * driverValue(ch.mqlToOppRate, 'mqlToOppRate', cid, m, fx.drivers);
        F.aeOpps[m] = ch.aeSelfSourced ? rampedAE[m] * A.selfSourcedOppsPerAePerMonth : 0;
        F.oppsCreated[m] = F.sourcedOpps[m] + F.aeOpps[m];
        totalCreated += F.oppsCreated[m];
      });
      var cap = rampedAE[m] * A.oppCapacityPerAePerMonth;
      var share = totalCreated <= cap ? 1 : cap / totalCreated;
      capacity.capacity[m] = cap;
      capacity.totalCreated[m] = totalCreated;
      capacity.workShare[m] = share;
      capacity.utilization[m] = cap > 0 ? totalCreated / cap : null;
      chs.forEach(function (cid) { funnel[cid].oppsWorked[m] = funnel[cid].oppsCreated[m] * share; });
    }

    var newArr = zeros(N), dealsTotal = zeros(N);
    for (m = 1; m <= H; m++) {
      var ms = milestoneShares(A, m);
      chs.forEach(function (cid) {
        var ch = A.channels[cid], F = funnel[cid];
        var src = m - ch.salesCycleMonths;
        var worked = src <= 0 ? ch.openingPipelineOppsPerMonth : F.oppsWorked[src];
        var wr = clamp(driverValue(ch.winRate, 'winRate', cid, m, fx.drivers) * (1 + ms.winRateLift), 0, 1);
        var acv = driverValue(ch.acv, 'acv', cid, m, fx.drivers) * (1 + ms.acvLift);
        F.winRate[m] = wr;
        F.acv[m] = acv;
        F.deals[m] = worked * wr;
        F.newArr[m] = F.deals[m] * acv;
        newArr[m] += F.newArr[m];
        dealsTotal[m] += F.deals[m];
      });
    }

    // --- 2.4 ARR rollforward and customers ---
    var arr = {
      arr: zeros(N), newArr: newArr, expansion: zeros(N), contraction: zeros(N), churn: zeros(N),
      churnRate: zeros(N), contractionRate: zeros(N), expansionRate: zeros(N),
      customers: zeros(N), deals: dealsTotal, lostCustomers: zeros(N)
    };
    arr.arr[0] = A.openingArr;
    arr.customers[0] = A.openingCustomers;
    for (m = 1; m <= H; m++) {
      var msA = milestoneShares(A, m);
      var cr = driverValue(A.churnRateMonthly, 'churnRateMonthly', null, m, fx.drivers) * Math.max(0, 1 - msA.churnReduction);
      var kr = driverValue(A.contractionRateMonthly, 'contractionRateMonthly', null, m, fx.drivers);
      var er = driverValue(A.expansionRateMonthly, 'expansionRateMonthly', null, m, fx.drivers);
      arr.churnRate[m] = cr;
      arr.contractionRate[m] = kr;
      arr.expansionRate[m] = er;
      arr.churn[m] = arr.arr[m - 1] * cr;
      arr.contraction[m] = arr.arr[m - 1] * kr;
      arr.expansion[m] = arr.arr[m - 1] * er;
      arr.arr[m] = arr.arr[m - 1] + newArr[m] + arr.expansion[m] - arr.contraction[m] - arr.churn[m];
      arr.lostCustomers[m] = arr.customers[m - 1] * cr;
      arr.customers[m] = arr.customers[m - 1] + dealsTotal[m] - arr.lostCustomers[m];
    }

    // --- 2.5 Revenue ---
    var revenue = zeros(N);
    for (m = 1; m <= H; m++) revenue[m] = (arr.arr[m - 1] + arr.arr[m]) / 24;

    // --- 2.6 Billing, deferred revenue and receivables ---
    var s = A.annualBillingShare;
    var invoices = zeros(H + 12); // index m + 11, m = -11 .. H
    for (j = 0; j < 12; j++) invoices[j] = s * A.openingArr * A.openingInvoiceWeights[j];
    var billing = { invoiceOffset: 11, invoices: invoices, monthlyBilled: zeros(N), billings: zeros(N), collections: zeros(N) };
    var dr = zeros(N), ar = zeros(N);
    for (j = 0; j <= 11; j++) dr[0] += invoices[11 - j] * (23 - 2 * j) / 24;
    for (m = 1; m <= H; m++) {
      invoices[m + 11] = s * (newArr[m] + arr.expansion[m]) + invoices[m - 1] - s * (arr.churn[m] + arr.contraction[m]);
      billing.monthlyBilled[m] = (1 - s) * revenue[m];
      billing.billings[m] = invoices[m + 11] + billing.monthlyBilled[m];
      dr[m] = dr[m - 1] + invoices[m + 11] - s * revenue[m];
    }
    function billingsAt(k) { return k <= 0 ? A.openingMonthlyBillings : billing.billings[k]; }
    var L = A.dsoDays / 30, nL = Math.floor(L), fL = L - nL;
    ar[0] = A.opening.accountsReceivable;
    for (m = 1; m <= H; m++) {
      var a = 0;
      for (j = 0; j <= nL - 1; j++) a += billingsAt(m - j);
      a += fL * billingsAt(m - nL);
      ar[m] = a;
      billing.collections[m] = ar[m - 1] + billing.billings[m] - ar[m];
    }

    // --- 2.7 P&L ---
    var pl = {
      revenue: revenue, hosting: zeros(N), thirdParty: zeros(N), cogsVendor: zeros(N), cogs: zeros(N),
      grossProfit: zeros(N), grossMargin: zeros(N),
      rdNonHc: zeros(N), rdVendor: zeros(N), rd: zeros(N),
      programSpend: zeros(N), commissions: zeros(N), smNonHc: zeros(N), smVendor: zeros(N), sm: zeros(N),
      gaNonHc: zeros(N), gaVendor: zeros(N), ga: zeros(N),
      opex: zeros(N), ebitda: zeros(N), depreciation: zeros(N), ebit: zeros(N),
      interestIncome: zeros(N), interestExpense: zeros(N), preTaxIncome: zeros(N), tax: zeros(N), netIncome: zeros(N)
    };
    for (m = 1; m <= H; m++) {
      var msC = milestoneShares(A, m);
      var hostBase = driverValue(A.hostingCostPerCustomerPerMonth, 'hostingCostPerCustomerPerMonth', null, m, fx.drivers);
      pl.hosting[m] = (arr.customers[m - 1] + arr.customers[m]) / 2 * hostBase * step(A.hostingCostGrowthAnnual, m) *
        Math.max(0, 1 - msC.hostingCostReduction);
      pl.thirdParty[m] = revenue[m] * A.thirdPartyPctOfRevenue;
      pl.cogsVendor[m] = fx.vendor.cogs[m];
      pl.cogs[m] = pl.hosting[m] + pl.thirdParty[m] + payroll.byLine.cogs[m] + pl.cogsVendor[m];
      pl.grossProfit[m] = revenue[m] - pl.cogs[m];
      pl.grossMargin[m] = revenue[m] !== 0 ? pl.grossProfit[m] / revenue[m] : null;

      var infl = step(A.costInflationAnnual, m);
      pl.rdNonHc[m] = A.nonHeadcountMonthly.rd * infl;
      pl.smNonHc[m] = A.nonHeadcountMonthly.sm * infl;
      pl.gaNonHc[m] = A.nonHeadcountMonthly.ga * infl;
      pl.rdVendor[m] = fx.vendor.rd[m];
      pl.smVendor[m] = fx.vendor.sm[m];
      pl.gaVendor[m] = fx.vendor.ga[m];
      var ps = 0;
      chs.forEach(function (cid) { ps += funnel[cid].spend[m]; });
      pl.programSpend[m] = ps;
      pl.commissions[m] = A.commissionRate * newArr[m];
      pl.rd[m] = payroll.byLine.rd[m] + pl.rdNonHc[m] + pl.rdVendor[m];
      pl.sm[m] = payroll.byLine.sm[m] + pl.programSpend[m] + pl.commissions[m] + pl.smNonHc[m] + pl.smVendor[m];
      pl.ga[m] = payroll.byLine.ga[m] + pl.gaNonHc[m] + pl.gaVendor[m];
      pl.opex[m] = pl.rd[m] + pl.sm[m] + pl.ga[m];
      pl.ebitda[m] = pl.grossProfit[m] - pl.opex[m];
    }

    // --- 2.8 Vendor spend and payables ---
    var vendor = { spend: zeros(N), paid: zeros(N) };
    var ap = zeros(N);
    for (m = 1; m <= H; m++) {
      vendor.spend[m] = pl.hosting[m] + pl.thirdParty[m] + pl.programSpend[m] + pl.rdNonHc[m] + pl.smNonHc[m] + pl.gaNonHc[m] +
        fx.vendor.cogs[m] + fx.vendor.rd[m] + fx.vendor.sm[m] + fx.vendor.ga[m];
    }
    function vendorAt(k) { return k <= 0 ? A.openingMonthlyVendorSpend : vendor.spend[k]; }
    var Lp = A.dpoDays / 30, nP = Math.floor(Lp), fP = Lp - nP;
    ap[0] = A.opening.accountsPayable;
    for (m = 1; m <= H; m++) {
      var b = 0;
      for (j = 0; j <= nP - 1; j++) b += vendorAt(m - j);
      b += fP * vendorAt(m - nP);
      ap[m] = b;
      vendor.paid[m] = ap[m - 1] + vendor.spend[m] - ap[m];
    }

    // --- 2.9 Capex and depreciation ---
    var capexArr = zeros(N), ppe = zeros(N);
    ppe[0] = A.opening.ppeNet;
    for (m = 1; m <= H; m++) capexArr[m] = A.capexMonthly + fx.capex[m];
    for (m = 1; m <= H; m++) {
      var dep = m <= A.openingPpeRemainingLifeMonths ? A.opening.ppeNet / A.openingPpeRemainingLifeMonths : 0;
      for (j = Math.max(1, m - A.usefulLifeMonths); j <= m - 1; j++) dep += capexArr[j] / A.usefulLifeMonths;
      pl.depreciation[m] = dep;
      ppe[m] = ppe[m - 1] + capexArr[m] - dep;
    }

    // --- 2.10, 2.11 Debt, interest, tax, net income and cash (month by month) ---
    var debt = zeros(N), principal = zeros(N), nol = zeros(N), cash = zeros(N);
    debt[0] = A.opening.ventureDebt;
    nol[0] = A.openingNol;
    cash[0] = A.opening.cash;
    for (m = 1; m <= H; m++) {
      var inAmort = A.debtAmortStartMonth <= m && m < A.debtAmortStartMonth + A.debtAmortMonths;
      principal[m] = inAmort ? Math.min(debt[m - 1], A.opening.ventureDebt / A.debtAmortMonths) : 0;
      debt[m] = debt[m - 1] - principal[m];
      pl.interestIncome[m] = Math.max(0, cash[m - 1]) * A.cashYieldAnnual / 12;
      pl.interestExpense[m] = debt[m - 1] * A.debtInterestRateAnnual / 12;
      pl.ebit[m] = pl.ebitda[m] - pl.depreciation[m];
      pl.preTaxIncome[m] = pl.ebit[m] + pl.interestIncome[m] - pl.interestExpense[m];
      var t = computeTax(pl.preTaxIncome[m], nol[m - 1], A.taxRate);
      pl.tax[m] = t.tax;
      nol[m] = t.nol;
      pl.netIncome[m] = pl.preTaxIncome[m] - pl.tax[m];
      cash[m] = cash[m - 1]
        + billing.collections[m]
        - payroll.total[m] - pl.commissions[m]
        - vendor.paid[m]
        - capexArr[m]
        + pl.interestIncome[m] - pl.interestExpense[m]
        - pl.tax[m]
        - principal[m];
    }

    // --- 2.12 Balance sheet ---
    var bs = {
      cash: cash, accountsReceivable: ar, prepaidAndOther: zeros(N), ppe: ppe, totalAssets: zeros(N),
      accountsPayable: ap, accruedLiabilities: zeros(N), deferredRevenue: dr, debt: debt, totalLiabilities: zeros(N),
      paidInCapital: zeros(N), retainedEarnings: zeros(N), totalEquity: zeros(N), totalLiabilitiesAndEquity: zeros(N)
    };
    for (m = 0; m <= H; m++) {
      bs.prepaidAndOther[m] = A.opening.prepaidAndOther;
      bs.accruedLiabilities[m] = A.opening.accruedLiabilities;
      bs.paidInCapital[m] = A.opening.paidInCapital;
      bs.totalAssets[m] = cash[m] + ar[m] + bs.prepaidAndOther[m] + ppe[m];
      bs.totalLiabilities[m] = ap[m] + bs.accruedLiabilities[m] + dr[m] + debt[m];
    }
    bs.retainedEarnings[0] = bs.totalAssets[0] - bs.totalLiabilities[0] - A.opening.paidInCapital;
    for (m = 1; m <= H; m++) bs.retainedEarnings[m] = bs.retainedEarnings[m - 1] + pl.netIncome[m];
    for (m = 0; m <= H; m++) {
      bs.totalEquity[m] = bs.paidInCapital[m] + bs.retainedEarnings[m];
      bs.totalLiabilitiesAndEquity[m] = bs.totalLiabilities[m] + bs.totalEquity[m];
    }

    // --- 2.13 Cash flow statement (indirect, computed separately from the direct cash above) ---
    var cf = { changeAr: zeros(N), changeAp: zeros(N), changeDr: zeros(N), cfo: zeros(N), cfi: zeros(N), cff: zeros(N),
      netChange: zeros(N), netBurn: zeros(N), fcf: zeros(N) };
    for (m = 1; m <= H; m++) {
      cf.changeAr[m] = ar[m] - ar[m - 1];
      cf.changeAp[m] = ap[m] - ap[m - 1];
      cf.changeDr[m] = dr[m] - dr[m - 1];
      cf.cfo[m] = pl.netIncome[m] + pl.depreciation[m] - cf.changeAr[m] + cf.changeAp[m] + cf.changeDr[m];
      cf.cfi[m] = -capexArr[m];
      cf.cff[m] = -principal[m];
      cf.netChange[m] = cf.cfo[m] + cf.cfi[m] + cf.cff[m];
      cf.netBurn[m] = -(cf.cfo[m] + cf.cfi[m]);
      cf.fcf[m] = cf.cfo[m] + cf.cfi[m] - pl.interestIncome[m] + pl.interestExpense[m];
    }

    // --- Initiative cost components (SPEC.md 2.17) ---
    var ic = { programSpend: zeros(N), payroll: payroll.initiative, vendor: zeros(N), capex: fx.capex, allocated: fx.allocated, investment: zeros(N) };
    for (m = 1; m <= H; m++) {
      chs.forEach(function (cid) { ic.programSpend[m] += fx.progSpend[cid][m]; });
      PL_LINES.forEach(function (l) { ic.vendor[m] += fx.vendor[l][m]; });
      ic.investment[m] = ic.programSpend[m] + ic.payroll[m] + ic.vendor[m] + ic.capex[m] + ic.allocated[m];
    }

    var months = [];
    for (m = 0; m <= H; m++) months.push(m === 0 ? 'Opening' : monthLabel(A, m));

    var result = {
      inputs: { assumptions: A, initiatives: inits },
      H: H, months: months,
      headcount: headcount, payroll: payroll, capacity: capacity, funnel: funnel,
      arr: arr, billing: billing, pl: pl, vendor: vendor,
      capex: { capex: capexArr }, debt: { principal: principal }, tax: { nol: nol },
      bs: bs, cf: cf, initiativeCost: ic
    };
    result.kpis = computeKpis(result);
    result.cash13 = cash13Week(result, 1);
    result.cashTests = cashTests(result);
    result.guardrails = guardrails(result);
    return result;
  }

  // ---------------------------------------------------------------------
  // KPIs (SPEC.md 2.15)
  // ---------------------------------------------------------------------
  function computeKpis(R) {
    var A = R.inputs.assumptions, H = R.H, N = H + 1;
    var K = {
      grossMarginTrailing: zeros(N), ebitdaMargin: zeros(N), arrGrowth: zeros(N), revenueGrowth: zeros(N), revenueGrowthBasis: [],
      avgBurn: zeros(N), runway: zeros(N), burnMultiple: zeros(N), blendedCacPayback: zeros(N),
      acquisitionSm: zeros(N), newLogoCacPayback: zeros(N), cac: zeros(N), ltv: zeros(N), ltvToCac: zeros(N),
      utilization: zeros(N), channelProgramCostPerDeal: {}
    };
    A.channelOrder.forEach(function (c) { K.channelProgramCostPerDeal[c] = zeros(N); });
    K.revenueGrowthBasis.push(null);
    var csm = R.payroll.byRole.csm || zeros(N);
    [K.grossMarginTrailing, K.ebitdaMargin, K.arrGrowth, K.revenueGrowth, K.avgBurn, K.runway, K.burnMultiple,
      K.blendedCacPayback, K.acquisitionSm, K.newLogoCacPayback, K.cac, K.ltv, K.ltvToCac, K.utilization].forEach(function (a) { a[0] = null; });
    A.channelOrder.forEach(function (c) { K.channelProgramCostPerDeal[c][0] = null; });

    for (var m = 1; m <= H; m++) K.acquisitionSm[m] = R.pl.sm[m] - csm[m];

    for (m = 1; m <= H; m++) {
      var W = Math.min(12, m), from = m - W + 1;
      var sGP = 0, sRev = 0, sBurn = 0, sSM = 0, sNew = 0, sExp = 0, sAcq = 0, sDeals = 0;
      for (var k = from; k <= m; k++) {
        sGP += R.pl.grossProfit[k]; sRev += R.pl.revenue[k]; sBurn += R.cf.netBurn[k]; sSM += R.pl.sm[k];
        sNew += R.arr.newArr[k]; sExp += R.arr.expansion[k]; sAcq += K.acquisitionSm[k]; sDeals += R.arr.deals[k];
      }
      var gmt = sRev !== 0 ? sGP / sRev : null;
      K.grossMarginTrailing[m] = gmt;
      K.ebitdaMargin[m] = R.pl.revenue[m] !== 0 ? R.pl.ebitda[m] / R.pl.revenue[m] : null;

      var arrM = R.arr.arr[m];
      if (m >= 12) K.arrGrowth[m] = R.arr.arr[m - 12] > 0 ? arrM / R.arr.arr[m - 12] - 1 : null;
      else K.arrGrowth[m] = (R.arr.arr[0] > 0 && arrM >= 0) ? Math.pow(arrM / R.arr.arr[0], 12 / m) - 1 : null;
      if (m >= 13) {
        K.revenueGrowth[m] = R.pl.revenue[m - 12] !== 0 ? R.pl.revenue[m] / R.pl.revenue[m - 12] - 1 : null;
        K.revenueGrowthBasis.push('revenue');
      } else {
        K.revenueGrowth[m] = K.arrGrowth[m];
        K.revenueGrowthBasis.push('arr');
      }

      var b0 = Math.max(1, m - 2), sb = 0;
      for (k = b0; k <= m; k++) sb += R.cf.netBurn[k];
      var avgBurn = sb / (m - b0 + 1);
      K.avgBurn[m] = avgBurn;
      K.runway[m] = avgBurn <= 0 ? Infinity : Math.max(0, R.bs.cash[m]) / avgBurn;

      var den = arrM - R.arr.arr[m - W];
      K.burnMultiple[m] = den > 0 ? sBurn / den : null;

      var bd = (sNew + sExp) * gmt;
      K.blendedCacPayback[m] = (gmt != null && bd > 0) ? 12 * sSM / bd : null;
      var nd = sNew * gmt;
      K.newLogoCacPayback[m] = (gmt != null && nd > 0) ? 12 * sAcq / nd : null;
      K.cac[m] = sDeals > 0 ? sAcq / sDeals : null;
      var custM = R.arr.customers[m];
      var lossRate = R.arr.churnRate[m] + R.arr.contractionRate[m];
      K.ltv[m] = (custM > 0 && lossRate > 0 && gmt != null) ? (arrM / custM) * gmt / (12 * lossRate) : null;
      K.ltvToCac[m] = (K.ltv[m] != null && K.cac[m] != null && K.cac[m] > 0) ? K.ltv[m] / K.cac[m] : null;
      K.utilization[m] = R.capacity.utilization[m];
      A.channelOrder.forEach(function (c) {
        var d = R.funnel[c].oppsWorked[m] * A.channels[c].winRate;
        K.channelProgramCostPerDeal[c][m] = d > 0 ? R.funnel[c].spend[m] / d : null;
      });
    }
    return K;
  }

  // ---------------------------------------------------------------------
  // 13-week cash forecast (SPEC.md 2.14)
  // ---------------------------------------------------------------------
  function cash13Week(R, t0) {
    var A = R.inputs.assumptions, H = R.H;
    t0 = t0 == null ? 1 : t0;
    var dailyCash = [R.bs.cash[t0 - 1]];
    var days = [null];
    var d = 0;
    for (var m = t0; m <= H && d < 91; m++) {
      var D = daysInMonth(A, m);
      for (var dd = 1; dd <= D && d < 91; dd++) {
        d++;
        var last = dd === D;
        var receipts = R.billing.collections[m] / D + (last ? R.pl.interestIncome[m] : 0);
        var pay = (dd === 15 ? R.payroll.total[m] / 2 : 0) + (last ? R.payroll.total[m] / 2 + R.pl.commissions[m] : 0);
        var vend = (R.vendor.paid[m] + R.capex.capex[m]) / D;
        var debtSvc = last ? R.pl.interestExpense[m] + R.debt.principal[m] : 0;
        var tax = last ? R.pl.tax[m] : 0;
        var net = receipts - pay - vend - debtSvc - tax;
        days.push({ day: d, month: m, dayOfMonth: dd, isMonthEnd: last, receipts: receipts, payrollAndCommissions: pay,
          vendorsAndCapex: vend, debtService: debtSvc, tax: tax, net: net });
        dailyCash.push(dailyCash[d - 1] + net);
      }
    }
    var weeks = [];
    var nWeeks = Math.floor(d / 7);
    for (var w = 1; w <= nWeeks; w++) {
      var wk = { week: w, startDay: 7 * w - 6, endDay: 7 * w, receipts: 0, payrollAndCommissions: 0, vendorsAndCapex: 0, debtService: 0, tax: 0, net: 0 };
      for (var x = wk.startDay; x <= wk.endDay; x++) {
        wk.receipts += days[x].receipts; wk.payrollAndCommissions += days[x].payrollAndCommissions;
        wk.vendorsAndCapex += days[x].vendorsAndCapex; wk.debtService += days[x].debtService;
        wk.tax += days[x].tax; wk.net += days[x].net;
      }
      wk.endCash = dailyCash[wk.endDay];
      wk.label = MONTH_NAMES[(days[wk.startDay].month - 1 + A.startMonth - 1) % 12] + ' ' + days[wk.startDay].dayOfMonth + ' to ' +
        MONTH_NAMES[(days[wk.endDay].month - 1 + A.startMonth - 1) % 12] + ' ' + days[wk.endDay].dayOfMonth;
      wk.belowFloor = wk.endCash < A.cashFloor;
      wk.belowCovenant = wk.endCash < A.minCashCovenant;
      weeks.push(wk);
    }
    var lowestWeek = null;
    weeks.forEach(function (wk) { if (lowestWeek === null || wk.endCash < lowestWeek.endCash) lowestWeek = wk; });
    var lowDay = 0;
    for (var y = 1; y < dailyCash.length; y++) if (dailyCash[y] < dailyCash[lowDay]) lowDay = y;
    return {
      t0: t0, startCash: dailyCash[0], dailyCash: dailyCash, days: days, weeks: weeks,
      lowestWeek: lowestWeek ? lowestWeek.week : null, lowestWeekCash: lowestWeek ? lowestWeek.endCash : null,
      lowestDay: lowDay, lowestDayCash: dailyCash[lowDay],
      anyWeekBelowFloor: weeks.some(function (wk) { return wk.belowFloor; }),
      anyWeekBelowCovenant: weeks.some(function (wk) { return wk.belowCovenant; })
    };
  }

  // ---------------------------------------------------------------------
  // Cash floor and covenant reporting (business warnings, also checked by C10)
  // ---------------------------------------------------------------------
  function cashTests(R) {
    var A = R.inputs.assumptions, H = R.H;
    var out = { floor: [null], covenant: [null], lowPoint: null, lowPointMonth: null, floorBreachMonths: [], covenantBreachMonths: [] };
    for (var m = 1; m <= H; m++) {
      var c = R.bs.cash[m];
      out.floor.push({ month: m, cash: c, threshold: A.cashFloor, breached: c < A.cashFloor });
      out.covenant.push({ month: m, cash: c, threshold: A.minCashCovenant, breached: c < A.minCashCovenant });
      if (c < A.cashFloor) out.floorBreachMonths.push(m);
      if (c < A.minCashCovenant) out.covenantBreachMonths.push(m);
      if (out.lowPoint === null || c < out.lowPoint) { out.lowPoint = c; out.lowPointMonth = m; }
    }
    return out;
  }

  // ---------------------------------------------------------------------
  // Objective and guardrails as reported (SPEC.md 2.18)
  // ---------------------------------------------------------------------
  function guardrails(R) {
    var A = R.inputs.assumptions, G = A.guardrails, K = R.kpis, H = R.H;
    var gm = Math.min(12, H);
    var om = Math.min(A.objective.month, H);
    var arrAt = R.arr.arr[om];
    var low = null, lowM = null;
    for (var m = 1; m <= H; m++) if (low === null || R.bs.cash[m] < low) { low = R.bs.cash[m]; lowM = m; }
    var minRw = null, minRwM = null;
    for (m = 1; m <= gm; m++) if (minRw === null || K.runway[m] < minRw) { minRw = K.runway[m]; minRwM = m; }
    var burnSum = 0;
    for (m = Math.max(1, gm - 11); m <= gm; m++) burnSum += R.cf.netBurn[m];
    var bm = K.burnMultiple[gm];
    var cac = K.blendedCacPayback[gm];
    var gmt = K.grossMarginTrailing[gm];
    var items = {
      objective: { label: 'ARR target', value: arrAt, month: om, target: A.objective.arrTarget, gap: A.objective.arrTarget - arrAt, pass: arrAt >= A.objective.arrTarget },
      cashFloor: { label: 'Cash floor', value: low, month: lowM, target: G.cashFloor, pass: low >= G.cashFloor },
      covenant: { label: 'Covenant', value: low, month: lowM, target: A.minCashCovenant, pass: low >= A.minCashCovenant },
      runway: { label: 'Runway', value: minRw, month: minRwM, target: G.minRunwayMonths, pass: minRw >= G.minRunwayMonths },
      cacPayback: { label: 'Blended CAC payback', value: cac, month: gm, target: G.maxBlendedCacPaybackMonths, pass: cac != null && cac <= G.maxBlendedCacPaybackMonths },
      burnMultiple: { label: 'Burn multiple', value: bm, month: gm, target: G.maxBurnMultiple, pass: bm != null ? bm <= G.maxBurnMultiple : burnSum <= 0 },
      grossMargin: { label: 'Gross margin', value: gmt, month: gm, target: G.minGrossMargin, pass: gmt != null && gmt >= G.minGrossMargin }
    };
    var guardKeys = ['cashFloor', 'runway', 'cacPayback', 'burnMultiple', 'grossMargin'];
    return {
      items: items,
      objectiveMet: items.objective.pass,
      guardrailsPassed: guardKeys.filter(function (k) { return items[k].pass; }).length,
      guardrailsTotal: guardKeys.length,
      allGuardrailsPass: guardKeys.every(function (k) { return items[k].pass; })
    };
  }

  // ---------------------------------------------------------------------
  // Series comparison helpers (used by C7, deltas and tests)
  // ---------------------------------------------------------------------
  var SKIP_KEYS = { inputs: 1 };
  function isNum(x) { return typeof x === 'number'; }

  // Largest absolute difference between two results, and where it is.
  function maxSeriesDiff(a, b, path) {
    path = path || '';
    var worst = { diff: 0, path: null };
    function visit(x, y, p) {
      if (isNum(x) || isNum(y) || x === null || y === null) {
        if (isNum(x) && isNum(y) && isFinite(x) && isFinite(y)) {
          var d = Math.abs(x - y);
          if (d > worst.diff) { worst.diff = d; worst.path = p; }
        } else if (!(x === y || (Number.isNaN(x) && Number.isNaN(y)))) {
          worst.diff = Infinity; worst.path = p;
        }
        return;
      }
      if (typeof x !== 'object' || typeof y !== 'object') {
        if (x !== y && worst.diff !== Infinity) { worst.diff = Infinity; worst.path = p; }
        return;
      }
      if (x === undefined || y === undefined) { worst.diff = Infinity; worst.path = p; return; }
      var keys = {};
      Object.keys(x).forEach(function (k) { keys[k] = 1; });
      Object.keys(y).forEach(function (k) { keys[k] = 1; });
      Object.keys(keys).forEach(function (k) {
        if (p === '' && SKIP_KEYS[k]) return;
        if (!(k in x) || !(k in y)) { worst.diff = Infinity; worst.path = p + '.' + k; return; }
        visit(x[k], y[k], p + '.' + k);
      });
    }
    visit(a, b, path);
    return worst;
  }

  // Scenario minus baseline for every numeric series.
  function deltaSeries(s, b) {
    function visit(x, y, top) {
      if (Array.isArray(x) && Array.isArray(y)) {
        return x.map(function (v, i) {
          var w = y[i];
          if (isNum(v) && isNum(w)) return (isFinite(v) && isFinite(w)) ? v - w : null;
          if (v && typeof v === 'object') return visit(v, w, false);
          return null;
        });
      }
      if (x && y && typeof x === 'object' && typeof y === 'object') {
        var o = {};
        Object.keys(x).forEach(function (k) {
          if (top && (SKIP_KEYS[k] || k === 'months' || k === 'guardrails' || k === 'cashTests')) return;
          if (isNum(x[k]) && isNum(y[k])) o[k] = (isFinite(x[k]) && isFinite(y[k])) ? x[k] - y[k] : null;
          else if (x[k] && typeof x[k] === 'object') o[k] = visit(x[k], y[k], false);
        });
        return o;
      }
      return null;
    }
    return visit(s, b, true);
  }

  // ---------------------------------------------------------------------
  // Initiatives against the baseline, and returns (SPEC.md 2.16, 2.17)
  // ---------------------------------------------------------------------
  var EPS = 1e-6;
  function paybackMonth(flows, effect, H) {
    var cum = 0, wentNeg = false, firstEffect = null;
    for (var m = 1; m <= H; m++) {
      cum += flows[m];
      if (firstEffect === null && (Math.abs(flows[m]) > EPS || (effect && Math.abs(effect[m]) > EPS))) firstEffect = m;
      if (!wentNeg) { if (cum < -EPS) wentNeg = true; }
      else if (cum >= -EPS) return { month: m, status: 'paid_back' };
    }
    if (wentNeg) return { month: null, status: 'not_within_horizon' };
    if (firstEffect === null) return { month: null, status: 'no_effect' };
    return { month: firstEffect, status: 'never_negative' };
  }

  function computeReturns(baseline, scenario) {
    var A = scenario.inputs.assumptions, H = scenario.H;
    var ic = scenario.initiativeCost;
    var r = Math.pow(1 + A.discountRateAnnual, 1 / 12) - 1;
    var NF = zeros(H + 1), cumNF = zeros(H + 1), earn = zeros(H + 1);
    var dFcf = zeros(H + 1), dEbitda = zeros(H + 1);
    var total = 0, npv = 0, sumNew = 0, sumDeals = 0, sumRev = 0, sumGP = 0, sumEbitda = 0;
    for (var m = 1; m <= H; m++) {
      dFcf[m] = scenario.cf.fcf[m] - baseline.cf.fcf[m];
      dEbitda[m] = scenario.pl.ebitda[m] - baseline.pl.ebitda[m];
      NF[m] = dFcf[m] - ic.allocated[m];
      cumNF[m] = cumNF[m - 1] + NF[m];
      earn[m] = dEbitda[m] - ic.allocated[m];
      total += ic.investment[m];
      npv += NF[m] / Math.pow(1 + r, m);
      sumNew += scenario.arr.newArr[m] - baseline.arr.newArr[m];
      sumDeals += scenario.arr.deals[m] - baseline.arr.deals[m];
      sumRev += scenario.pl.revenue[m] - baseline.pl.revenue[m];
      sumGP += scenario.pl.grossProfit[m] - baseline.pl.grossProfit[m];
      sumEbitda += dEbitda[m];
    }
    var maxU = null, maxUM = null;
    for (m = 1; m <= H; m++) {
      var u = scenario.capacity.utilization[m];
      if (u != null && (maxU === null || u > maxU)) { maxU = u; maxUM = m; }
    }
    var gm = Math.min(12, H);
    function minRunway(R) { var v = null; for (var k = 1; k <= gm; k++) if (v === null || R.kpis.runway[k] < v) v = R.kpis.runway[k]; return v; }
    return {
      monthlyDiscountRate: r,
      netFlow: NF, cumNetFlow: cumNF, earningsFlow: earn, deltaFcf: dFcf, deltaEbitda: dEbitda,
      investment: ic.investment,
      totalInvestment: total,
      npv: npv,
      roi: total > EPS ? cumNF[H] / total : null,
      newArrPerDollar: total > EPS ? sumNew / total : null,
      payback: paybackMonth(NF, ic.investment, H),
      earningsPayback: paybackMonth(earn, ic.investment, H),
      extraDeals: sumDeals, extraNewArr: sumNew,
      sumDeltaRevenue: sumRev, sumDeltaGrossProfit: sumGP, sumDeltaEbitda: sumEbitda,
      cashLowPoint: { scenario: scenario.cashTests.lowPoint, scenarioMonth: scenario.cashTests.lowPointMonth,
        baseline: baseline.cashTests.lowPoint, baselineMonth: baseline.cashTests.lowPointMonth,
        change: scenario.cashTests.lowPoint - baseline.cashTests.lowPoint },
      highestUtilization: maxU, highestUtilizationMonth: maxUM,
      burnMultiple12: { scenario: scenario.kpis.burnMultiple[gm], baseline: baseline.kpis.burnMultiple[gm] },
      blendedCacPayback12: { scenario: scenario.kpis.blendedCacPayback[gm], baseline: baseline.kpis.blendedCacPayback[gm] },
      lowestRunway12: { scenario: minRunway(scenario), baseline: minRunway(baseline) }
    };
  }

  function applyInitiatives(assumptions, initiatives) {
    var baseline = runModel(assumptions, []);
    var scenario = runModel(assumptions, initiatives || []);
    return { baseline: baseline, scenario: scenario, delta: deltaSeries(scenario, baseline), returns: computeReturns(baseline, scenario) };
  }

  // ---------------------------------------------------------------------
  // Initiative templates (SPEC.md 1.17)
  // ---------------------------------------------------------------------
  function byMonthRange(from, to, amount) { var o = {}; for (var m = from; m <= to; m++) o[m] = amount; return o; }
  function single(m, amount) { var o = {}; o[m] = amount; return o; }
  function withDefaults(defaults, opts) { var o = clone(defaults); Object.keys(opts || {}).forEach(function (k) { o[k] = opts[k]; }); return o; }

  var templates = {
    tradeShow: function (A, opts) {
      var p = withDefaults(A.templates.tradeShow, opts);
      return { id: p.id || 'trade_show', name: p.name || 'Trade show', template: 'tradeShow', params: p, effects: [
        { kind: 'program_spend', channel: p.channel, byMonth: single(p.month, p.booth + p.travel), leads: 'none' },
        { kind: 'direct_leads', channel: p.channel, byMonth: single(p.month, p.expectedLeads) },
        { kind: 'allocated_cost', byMonth: single(p.month, p.staffDays * p.dayCost) }
      ] };
    },
    hireSdrs: function (A, opts) {
      var p = withDefaults(A.templates.hireSdrs, opts);
      return { id: p.id || 'hire_sdrs', name: p.name || 'Hire SDRs', template: 'hireSdrs', params: p, effects: [
        { kind: 'headcount', role: 'sdr', count: p.count, startMonth: p.startMonth, loadedCostAnnual: p.loadedCostAnnual },
        { kind: 'vendor_cost', line: 'sm', byMonth: single(p.startMonth, p.recruitingEach * p.count) },
        { kind: 'program_spend', channel: 'outbound', byMonth: byMonthRange(p.startMonth, A.horizonMonths, p.toolsPerSdrMonthly * p.count), leads: 'none' }
      ] };
    },
    hireAes: function (A, opts) {
      var p = withDefaults(A.templates.hireAes, opts);
      return { id: p.id || 'hire_aes', name: p.name || 'Hire AEs', template: 'hireAes', params: p, effects: [
        { kind: 'headcount', role: 'ae', count: p.count, startMonth: p.startMonth, loadedCostAnnual: p.loadedCostAnnual },
        { kind: 'vendor_cost', line: 'sm', byMonth: single(p.startMonth, p.recruitingEach * p.count) }
      ] };
    },
    paidCampaign: function (A, opts) {
      var p = withDefaults(A.templates.paidCampaign, opts);
      return { id: p.id || 'paid_campaign', name: p.name || 'Paid campaign', template: 'paidCampaign', params: p, effects: [
        { kind: 'program_spend', channel: p.channel, byMonth: byMonthRange(p.startMonth, p.startMonth + p.months - 1, p.budget / p.months),
          leads: 'from_cpl', cplMultiplier: p.cplMultiplier }
      ] };
    },
    partnerProgram: function (A, opts) {
      var p = withDefaults(A.templates.partnerProgram, opts);
      return { id: p.id || 'partner_program', name: p.name || 'Partner program', template: 'partnerProgram', params: p, effects: [
        { kind: 'vendor_cost', line: 'sm', byMonth: single(p.setupMonth, p.setup) },
        { kind: 'program_spend', channel: 'partners', byMonth: byMonthRange(p.startMonth, p.startMonth + p.months - 1, p.coMarketingMonthly), leads: 'from_cpl' }
      ] };
    }
  };

  // One of each effect kind, all amounts zero (check C7, test T42).
  function nullInitiative() {
    return { id: 'null', name: 'Null initiative', template: 'none', effects: [
      { kind: 'program_spend', channel: 'paid', byMonth: { 3: 0 }, leads: 'from_cpl', cplMultiplier: 1 },
      { kind: 'direct_leads', channel: 'events', byMonth: { 4: 0 } },
      { kind: 'headcount', role: 'ae', count: 0, startMonth: 5 },
      { kind: 'vendor_cost', line: 'sm', byMonth: { 2: 0 } },
      { kind: 'allocated_cost', byMonth: { 2: 0 } },
      { kind: 'capex', byMonth: { 2: 0 } },
      { kind: 'driver_change', driver: 'winRate', channel: 'paid', fromMonth: 1, toMonth: 36, mode: 'add', value: 0 }
    ] };
  }

  // ---------------------------------------------------------------------
  // Integrity checks (SPEC.md section 3). Every total is recomputed from
  // its parts or from the inputs; stored totals are never trusted.
  // ---------------------------------------------------------------------
  function Recorder(id, name, R) {
    this.id = id; this.name = name; this.pass = true; this.firstMonth = null; this.diff = 0; this.reason = '';
    this._R = R;
  }
  Recorder.prototype.fail = function (m, diff, reason) {
    if (!this.pass) return;
    this.pass = false; this.firstMonth = m; this.diff = diff;
    var lbl = (m == null) ? '' : (' in ' + (this._R && this._R.months && this._R.months[m] ? this._R.months[m] + ' (m=' + m + ')' : 'm=' + m));
    this.reason = reason + lbl;
  };
  Recorder.prototype.eq = function (m, a, b, tol, label) {
    var d = a - b;
    if (!(Math.abs(d) <= tol)) this.fail(m, d, label + ': ' + fmtNum(a) + ' vs ' + fmtNum(b) + ' (difference ' + fmtNum(d) + ')');
  };
  Recorder.prototype.ge = function (m, a, b, tol, label) {
    if (!(a >= b - tol)) this.fail(m, a - b, label + ': ' + fmtNum(a) + ' is below ' + fmtNum(b));
  };
  Recorder.prototype.ok = function (m, cond, reason) { if (!cond) this.fail(m, null, reason); };
  Recorder.prototype.out = function () {
    return { id: this.id, name: this.name, pass: this.pass, firstMonth: this.firstMonth, diff: this.diff, reason: this.pass ? '' : this.reason };
  };
  function fmtNum(x) {
    if (typeof x !== 'number') return String(x);
    if (!isFinite(x)) return String(x);
    return (Math.round(x * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function at(arr, i) { return arr ? arr[i] : undefined; }

  function runChecks(R, opts) {
    opts = opts || {};
    var A = R.inputs.assumptions, H = R.H, D = TOL_DOLLAR, Cn = TOL_COUNT;
    var chs = A.channelOrder;
    var out = [];
    var m, c, j, ck;

    // C1 Balance sheet balances, m = 0..H
    ck = new Recorder('C1', 'Balance sheet balances', R);
    for (m = 0; m <= H; m++) {
      var assets = R.bs.cash[m] + R.bs.accountsReceivable[m] + R.bs.prepaidAndOther[m] + R.bs.ppe[m];
      var liab = R.bs.accountsPayable[m] + R.bs.accruedLiabilities[m] + R.bs.deferredRevenue[m] + R.bs.debt[m];
      var eq = R.bs.paidInCapital[m] + R.bs.retainedEarnings[m];
      ck.eq(m, assets, liab + eq, D, 'Assets vs liabilities plus equity');
    }
    out.push(ck.out());

    // C2 Cash flow ties to the balance sheet
    ck = new Recorder('C2', 'Cash flow ties to the balance sheet', R);
    for (m = 1; m <= H; m++) {
      ck.eq(m, R.bs.cash[m], R.bs.cash[m - 1] + R.cf.cfo[m] + R.cf.cfi[m] + R.cf.cff[m], D, 'Direct cash vs opening cash plus CFO, CFI and CFF');
      var cfo = R.pl.netIncome[m] + R.pl.depreciation[m] - (R.bs.accountsReceivable[m] - R.bs.accountsReceivable[m - 1]) +
        (R.bs.accountsPayable[m] - R.bs.accountsPayable[m - 1]) + (R.bs.deferredRevenue[m] - R.bs.deferredRevenue[m - 1]);
      ck.eq(m, R.cf.cfo[m], cfo, D, 'CFO vs net income plus depreciation and working capital changes');
      ck.eq(m, R.cf.cfi[m], -R.capex.capex[m], D, 'CFI vs capex');
      ck.eq(m, R.cf.cff[m], -R.debt.principal[m], D, 'CFF vs principal');
    }
    out.push(ck.out());

    // C3 Net income rolls into retained earnings
    ck = new Recorder('C3', 'Net income rolls into retained earnings', R);
    for (m = 1; m <= H; m++) ck.eq(m, R.bs.retainedEarnings[m], R.bs.retainedEarnings[m - 1] + R.pl.netIncome[m], D, 'Retained earnings roll');
    out.push(ck.out());

    // C4 ARR rollforward ties
    ck = new Recorder('C4', 'ARR rollforward ties', R);
    for (m = 1; m <= H; m++) {
      ck.eq(m, R.arr.arr[m], R.arr.arr[m - 1] + R.arr.newArr[m] + R.arr.expansion[m] - R.arr.contraction[m] - R.arr.churn[m], D, 'ARR rollforward');
      var sumNew = 0;
      chs.forEach(function (cid) { sumNew += R.funnel[cid].newArr[m]; });
      ck.eq(m, R.arr.newArr[m], sumNew, D, 'New ARR vs sum of channels');
    }
    for (m = 0; m <= H; m++) ck.ge(m, R.arr.arr[m], 0, D, 'ARR');
    out.push(ck.out());

    // C5 Funnel shape
    ck = new Recorder('C5', 'Funnel shape', R);
    for (m = 1; m <= H; m++) {
      var worked = 0;
      chs.forEach(function (cid) {
        var F = R.funnel[cid], ch = A.channels[cid];
        ck.ge(m, F.leads[m], F.mql[m], Cn, cid + ' leads vs MQLs');
        ck.ge(m, F.mql[m], F.sourcedOpps[m], Cn, cid + ' MQLs vs sourced opportunities');
        ck.ge(m, F.sourcedOpps[m], 0, Cn, cid + ' sourced opportunities');
        ck.ge(m, F.oppsCreated[m], F.oppsWorked[m], Cn, cid + ' created vs worked opportunities');
        ck.ge(m, F.oppsWorked[m], 0, Cn, cid + ' worked opportunities');
        var src = m - ch.salesCycleMonths;
        var w = src <= 0 ? ch.openingPipelineOppsPerMonth : F.oppsWorked[src];
        ck.ge(m, w, F.deals[m], Cn, cid + ' worked opportunities vs deals');
        worked += F.oppsWorked[m];
      });
      if (R.capacity.workShare[m] < 1) ck.ge(m, R.capacity.capacity[m], worked, Cn, 'Capacity vs opportunities worked');
    }
    out.push(ck.out());

    // C6 Channel spend equals P&L program spend
    ck = new Recorder('C6', 'Channel spend equals P&L program spend', R);
    var fromInputs = zeros(H + 1);
    for (m = 1; m <= H; m++) chs.forEach(function (cid) { fromInputs[m] += A.channels[cid].programSpendMonthly * step(A.programSpendGrowthAnnual, m); });
    (R.inputs.initiatives || []).forEach(function (init) {
      (init.effects || []).forEach(function (e) {
        if (e.kind === 'program_spend') eachMonth(e.byMonth, H, function (mm, v) { fromInputs[mm] += v; });
      });
    });
    for (m = 1; m <= H; m++) {
      var fs = 0;
      chs.forEach(function (cid) { fs += R.funnel[cid].spend[m]; });
      ck.eq(m, fs, R.pl.programSpend[m], D, 'Funnel spend vs P&L program spend');
      ck.eq(m, R.pl.programSpend[m], fromInputs[m], D, 'P&L program spend vs inputs');
    }
    out.push(ck.out());

    // C7 A zero initiative changes nothing
    ck = new Recorder('C7', 'A zero initiative changes nothing', R);
    try {
      var nullInit = opts.nullInitiative || nullInitiative();
      var rerun = runModel(A, (R.inputs.initiatives || []).concat([nullInit]));
      var md = maxSeriesDiff(rerun, R);
      if (!(md.diff <= 1e-6)) ck.fail(null, md.diff, 'Null initiative changed ' + md.path + ' by ' + fmtNum(md.diff));
    } catch (err) {
      ck.fail(null, null, 'Null initiative run failed: ' + err.message);
    }
    out.push(ck.out());

    // C8 Revenue equals what ARR implies
    ck = new Recorder('C8', 'Revenue equals what ARR implies', R);
    for (m = 1; m <= H; m++) ck.eq(m, R.pl.revenue[m] * 24, R.arr.arr[m - 1] + R.arr.arr[m], D, 'Revenue x 24 vs opening plus closing ARR');
    out.push(ck.out());

    // C9 Deferred revenue rolls forward
    ck = new Recorder('C9', 'Deferred revenue rolls forward', R);
    var s = A.annualBillingShare, off = R.billing.invoiceOffset, I = R.billing.invoices;
    for (m = 0; m <= H; m++) {
      if (m >= 1) ck.eq(m, R.bs.deferredRevenue[m], R.bs.deferredRevenue[m - 1] + I[m + off] - s * R.pl.revenue[m], D, 'Deferred revenue roll');
      var sched = 0, last12 = 0;
      for (j = 0; j <= 11; j++) { sched += I[m - j + off] * (23 - 2 * j) / 24; last12 += I[m - j + off]; }
      ck.eq(m, R.bs.deferredRevenue[m], sched, D, 'Deferred revenue vs invoice schedule');
      ck.eq(m, last12, s * R.arr.arr[m], D, 'Last 12 annual invoices vs annual-billed ARR');
      ck.ge(m, I[m + off], 0, D, 'Annual invoices');
    }
    out.push(ck.out());

    // C10 Covenant and cash floor are reported
    ck = new Recorder('C10', 'Covenant and cash floor are reported', R);
    var CT = R.cashTests;
    if (!CT) ck.fail(null, null, 'No cash floor or covenant report');
    else {
      var low = null, lowM = null, fb = [], cb = [];
      for (m = 1; m <= H; m++) {
        var cash = R.bs.cash[m];
        if (low === null || cash < low) { low = cash; lowM = m; }
        if (cash < A.cashFloor) fb.push(m);
        if (cash < A.minCashCovenant) cb.push(m);
        var f = at(CT.floor, m), v = at(CT.covenant, m);
        ck.ok(m, !!f && f.month === m && f.breached === (cash < A.cashFloor), 'Cash floor result missing or wrong');
        ck.ok(m, !!v && v.month === m && v.breached === (cash < A.minCashCovenant), 'Covenant result missing or wrong');
      }
      ck.eq(lowM, CT.lowPoint, low, D, 'Reported low point vs balance sheet cash');
      ck.ok(null, CT.lowPointMonth === lowM, 'Reported low point month ' + CT.lowPointMonth + ' vs ' + lowM);
      ck.ok(null, JSON.stringify(CT.floorBreachMonths) === JSON.stringify(fb), 'Reported floor breach months do not match balance sheet cash');
      ck.ok(null, JSON.stringify(CT.covenantBreachMonths) === JSON.stringify(cb), 'Reported covenant breach months do not match balance sheet cash');
    }
    out.push(ck.out());

    // C11 Receivables and payables roll forward
    ck = new Recorder('C11', 'Receivables and payables roll forward', R);
    for (m = 1; m <= H; m++) {
      ck.eq(m, R.bs.accountsReceivable[m], R.bs.accountsReceivable[m - 1] + R.billing.billings[m] - R.billing.collections[m], D, 'Receivables roll');
      ck.eq(m, R.bs.accountsPayable[m], R.bs.accountsPayable[m - 1] + R.vendor.spend[m] - R.vendor.paid[m], D, 'Payables roll');
      ck.ge(m, R.billing.collections[m], 0, D, 'Collections');
      ck.ge(m, R.vendor.paid[m], 0, D, 'Vendor payments');
    }
    for (m = 0; m <= H; m++) {
      ck.ge(m, R.bs.accountsReceivable[m], 0, D, 'Receivables');
      ck.ge(m, R.bs.accountsPayable[m], 0, D, 'Payables');
      ck.ge(m, R.bs.deferredRevenue[m], 0, D, 'Deferred revenue');
    }
    out.push(ck.out());

    // C12 Payroll ties to headcount (recomputed from the roster, planned hires and initiative hires)
    ck = new Recorder('C12', 'Payroll ties to headcount', R);
    var hires = A.plannedHires.map(function (h) { return { role: h.role, count: 1, start: h.month, end: H, cost: A.roles[h.role].loadedCostAnnual }; });
    (R.inputs.initiatives || []).forEach(function (init) {
      (init.effects || []).forEach(function (e) {
        if (e.kind === 'headcount') hires.push({ role: e.role, count: e.count || 0, start: e.startMonth, end: e.endMonth == null ? H : e.endMonth,
          cost: e.loadedCostAnnual == null ? A.roles[e.role].loadedCostAnnual : e.loadedCostAnnual });
      });
    });
    for (m = 1; m <= H; m++) {
      var byLines = 0;
      PL_LINES.forEach(function (l) { byLines += R.payroll.byLine[l][m]; });
      var formula = 0, hcSum = 0, hcRoles = 0;
      Object.keys(A.roles).forEach(function (rid) {
        var R0 = A.roles[rid], cnt = R0.openingCount, ann = R0.openingCount * R0.loadedCostAnnual;
        hires.forEach(function (h) { if (h.role === rid && h.start <= m && m <= h.end) { cnt += h.count; ann += h.count * h.cost; } });
        formula += ann / 12 * step(A.meritIncreaseAnnual, m);
        hcSum += cnt;
        hcRoles += R.headcount.byRole[rid][m];
        ck.eq(m, R.headcount.byRole[rid][m], cnt, Cn, 'Headcount of ' + rid);
      });
      ck.eq(m, byLines, formula, D, 'Payroll by P&L line vs payroll by role formula');
      ck.eq(m, R.payroll.total[m], byLines, D, 'Total payroll vs sum of lines');
      ck.eq(m, R.headcount.total[m], hcRoles, Cn, 'Total headcount vs sum by role');
      ck.eq(m, hcRoles, hcSum, Cn, 'Headcount by role vs inputs');
    }
    out.push(ck.out());

    // C13 P&L foots
    ck = new Recorder('C13', 'P&L foots', R);
    for (m = 1; m <= H; m++) {
      var P = R.pl, PB = R.payroll.byLine;
      var cogs = P.hosting[m] + P.thirdParty[m] + PB.cogs[m] + P.cogsVendor[m];

    this.n++;
    if (expected === Infinity || expected === -Infinity) { if (actual !== expected) this.fail(label + ': got ' + actual + ', expected ' + expected); return; }
    if (typeof actual !== 'number' || !(Math.abs(actual - expected) <= tol)) {
      this.fail(label + ': got ' + show(actual) + ', expected ' + show(expected) + ' (tolerance ' + tol + ')');
    }
  };
  Ctx.prototype.d = function (label, actual, expected) { this.near(label, actual, expected, TOL_D); };
  Ctx.prototype.r = function (label, actual, expected) { this.near(label, actual, expected, TOL_R); };
  // Two-decimal ratios (months, multiples) are printed in SPEC.md to 2 decimals.
  Ctx.prototype.r2 = function (label, actual, expected) { this.near(label, actual, expected, 0.005 + 1e-9); };
  Ctx.prototype.eq = function (label, actual, expected) {
    this.n++;
    if (actual !== expected) this.fail(label + ': got ' + JSON.stringify(actual) + ', expected ' + JSON.stringify(expected));
  };
  // Compare against a raw cell from a SPEC.md table. The tolerance is the spec
  // tolerance (dollars 0.01, counts and ratios 0.0001) or half a unit of the last
  // printed digit, whichever is larger.
  Ctx.prototype.cell = function (label, actual, raw, kind) {
    var p = parseCell(raw);
    if (p.text != null) { this.fail(label + ': cell is not a number: ' + raw); return; }
    var half = 0.5 * Math.pow(10, -p.decimals) + 1e-9;
    var tol = Math.max(kind === 'dollar' ? TOL_D : TOL_R, half);
    this.near(label, actual, p.value, tol);
  };
  function show(x) { return typeof x === 'number' ? (isFinite(x) ? x.toFixed(6) : String(x)) : JSON.stringify(x); }

  function parseCell(raw) {
    var s = String(raw).trim().replace(/−/g, '-').replace(/,/g, '');
    if (s === 'not burning') return { value: Infinity, decimals: 0 };
    var pct = false;
    if (/%$/.test(s)) { pct = true; s = s.slice(0, -1); }
    if (!/^[-+]?\d+(\.\d+)?$/.test(s)) return { text: raw };
    var dec = (s.split('.')[1] || '').length;
    var v = Number(s);
    if (pct) { v = v / 100; dec += 2; }
    return { value: v, decimals: dec };
  }
  function colIndex(table, name) {
    var i = table.header.indexOf(name);

  // ===== 4.2 Tamper tests =====
  function tamper(t, mutate, expected, opts) {
    var copy = structuredClone(base());
    mutate(copy);
    var checks = E.runChecks(copy, opts);
    var byId = {};
    checks.forEach(function (c) { byId[c.id] = c; });
    Object.keys(expected).forEach(function (id) {
      var c = byId[id];
      t.ok(id + ' fails', c && !c.pass, c ? 'it passed' : 'missing');
      if (c && !c.pass) {
        t.ok(id + ' gives a reason', typeof c.reason === 'string' && c.reason.length > 0);
        if (expected[id] !== null) t.eq(id + ' first failing month', c.firstMonth, expected[id]);
      }
    });
    // The untouched baseline still passes the same checks.
    var clean = E.runChecks(base());
    Object.keys(expected).forEach(function (id) {
      var c = clean.filter(function (x) { return x.id === id; })[0];
      t.ok(id + ' passes on the untouched baseline', c && c.pass);
    });
  }

    t.d('Hosting m4', R.pl.hosting[4], 176140.83); t.d('Baseline hosting m4', base().pl.hosting[4], 220176.04);
  });
  test('T61', 'All three milestones disabled', function (t) {
    var R = sc('T61').baseline;
    t.d('ARR m12', R.arr.arr[12], 30048489.36); t.d('ARR m36', R.arr.arr[36], 45114663.02);
    t.d('Cash low point', R.cashTests.lowPoint, 15381981.28); t.eq('Cash low point month', R.cashTests.lowPointMonth, 36);
  });
  test('T62', 'Annual billing share of 0', function (t) {
    var R = sc('T62').baseline;
    for (var m = 0; m <= 36; m++) t.d('Deferred revenue m' + m, R.bs.deferredRevenue[m], 0);
    t.d('Opening retained earnings', R.bs.retainedEarnings[0], -65230000);
    t.d('Cash m1', R.bs.cash[1], 36964790.00);
  });
  test('T63', 'Tax function', function (t) {
    var c = [[-100000, 500000, 0, 600000], [100000, 500000, 0, 400000], [100000, 40000, 15000, 0], [100000, 0, 25000, 0]];
    c.forEach(function (x) {
      var r = E.computeTax(x[0], x[1], 0.25);
      t.d('Tax (' + x[0] + ', ' + x[1] + ')', r.tax, x[2]); t.d('NOL (' + x[0] + ', ' + x[1] + ')', r.nol, x[3]);
    });
  });
  test('T64', 'Ramp function', function (t) {
    [[-1, 4, 0], [0, 4, 0], [1, 4, 0.25], [4, 4, 1], [9, 4, 1], [0, 0, 1], [-1, 0, 0]].forEach(function (x) {
      t.eq('ramp(' + x[0] + ', ' + x[1] + ')', E.ramp(x[0], x[1]), x[2]);
    });
  });

  // ---------- runner ----------
  function run() {
    var results = [];
    tests.forEach(function (tc) {
      var t = new Ctx();
      var t0 = (typeof performance !== 'undefined') ? performance.now() : 0;
      try { tc.fn(t); } catch (err) { t.fail('Threw: ' + (err && err.stack || err)); }
      results.push({ id: tc.id, name: tc.name, pass: t.failures.length === 0, assertions: t.n, failures: t.failures,
        ms: (typeof performance !== 'undefined') ? Math.round(performance.now() - t0) : 0 });
    });
    var passed = results.filter(function (r) { return r.pass; }).length;
    var baseChecks = E.runChecks(base());
    return {
      total: results.length, passed: passed, failed: results.length - passed,
      assertions: results.reduce(function (s, r) { return s + r.assertions; }, 0),
      integrity: E.checkSummary(baseChecks).label,
      checks: baseChecks,
      results: results
    };
  }
  function format(rep) {
    var lines = [];
    lines.push('Capital Allocation Copilot: SPEC.md test plan');
    lines.push('Baseline ' + rep.integrity);
    rep.checks.forEach(function (c) { lines.push('  ' + (c.pass ? 'pass ' : 'FAIL ') + c.id + ' ' + c.name + (c.pass ? '' : ': ' + c.reason)); });
    lines.push('');
    rep.results.forEach(function (r) {
      lines.push((r.pass ? 'PASS ' : 'FAIL ') + r.id + ' ' + r.name + ' (' + r.assertions + ' assertions)');
      r.failures.slice(0, 15).forEach(function (f) { lines.push('     - ' + f); });
      if (r.failures.length > 15) lines.push('     ... and ' + (r.failures.length - 15) + ' more');
    });
    lines.push('');
    lines.push(rep.passed + ' of ' + rep.total + ' tests passed, ' + rep.assertions + ' assertions.');
    return lines.join('\n');
  }
  return { run: run, format: format, parseCell: parseCell, tests: tests };
})();
</script>

<!-- UI: reads engine outputs and renders them. No math here.              -->
<!-- ===================================================================== -->
<script id="ui">
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);

  function money(x) {
    if (x == null) return 'n/a';
    if (!isFinite(x)) return x > 0 ? 'not burning' : 'n/a';
    return Math.round(x).toLocaleString('en-US');
  }
  function num(x, d) {
    if (x == null) return 'n/a';
    if (!isFinite(x)) return 'not burning';
    return x.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function pct(x) { return x == null ? 'n/a' : (x * 100).toFixed(1) + '%'; }
  function el(tag, text) { var e = document.createElement(tag); if (text != null) e.textContent = text; return e; }
  function table(headers, rows) {
    var t = el('table'); t.border = '1'; t.cellPadding = '3';
    var tr = el('tr'); headers.forEach(function (h) { tr.appendChild(el('th', h)); }); t.appendChild(tr);
    rows.forEach(function (r) { var row = el('tr'); r.forEach(function (c) { row.appendChild(el('td', c)); }); t.appendChild(row); });
    return t;
  }

  function renderBadge(res) {
    var b = Engine.checkSummary(res.checks.baseline), s = Engine.checkSummary(res.checks.scenario);
    var worst = b.passed <= s.passed ? b : s;
    var badge = document.getElementById('badge');
    badge.textContent = worst.label;
    badge.style.color = worst.passed === worst.total ? 'green' : 'red';
    badge.style.fontWeight = 'bold';
    var box = document.getElementById('check-failures');
    box.innerHTML = '';
    [['Baseline', res.checks.baseline], ['Scenario', res.checks.scenario]].forEach(function (pair) {
      pair[1].filter(function (c) { return !c.pass; }).forEach(function (c) {
        var p = el('p', pair[0] + ' ' + c.id + ' ' + c.name + ' failed: ' + c.reason);
        p.style.color = 'red';
        box.appendChild(p);
      });
    });
  }

  function renderApp(res) {
    var R = res.baseline, app = document.getElementById('app');
    app.innerHTML = '';

    app.appendChild(el('h2', 'Objective and guardrails (baseline)'));
    var G = R.guardrails.items;
    app.appendChild(table(['Item', 'Value', 'Month', 'Target', 'Result'], [
      ['ARR target', money(G.objective.value), R.months[G.objective.month], money(G.objective.target), G.objective.pass ? 'met' : 'not met, gap ' + money(G.objective.gap)],
      ['Cash floor', money(G.cashFloor.value), R.months[G.cashFloor.month], money(G.cashFloor.target), G.cashFloor.pass ? 'pass' : 'fail'],
      ['Covenant', money(G.covenant.value), R.months[G.covenant.month], money(G.covenant.target), G.covenant.pass ? 'pass' : 'fail'],
      ['Runway (months)', num(G.runway.value, 2), R.months[G.runway.month], num(G.runway.target, 0), G.runway.pass ? 'pass' : 'fail'],
      ['Blended CAC payback (months)', num(G.cacPayback.value, 2), R.months[G.cacPayback.month], num(G.cacPayback.target, 0), G.cacPayback.pass ? 'pass' : 'fail'],
      ['Burn multiple', num(G.burnMultiple.value, 2), R.months[G.burnMultiple.month], num(G.burnMultiple.target, 2), G.burnMultiple.pass ? 'pass' : 'fail'],
      ['Gross margin, trailing', pct(G.grossMargin.value), R.months[G.grossMargin.month], pct(G.grossMargin.target), G.grossMargin.pass ? 'pass' : 'fail']
    ]));

    app.appendChild(el('h2', 'Monthly baseline (raw engine output)'));
    var rows = [];
    for (var m = 1; m <= R.H; m++) {
      rows.push([String(m), R.months[m], money(R.arr.newArr[m]), money(R.arr.arr[m]), num(R.arr.customers[m], 1), money(R.pl.revenue[m]),
        money(R.pl.grossProfit[m]), money(R.pl.ebitda[m]), money(R.pl.netIncome[m]), money(R.cf.netBurn[m]), money(R.bs.cash[m]),
        money(R.bs.deferredRevenue[m]), String(R.headcount.total[m]), pct(R.capacity.utilization[m]), num(R.kpis.runway[m], 1),
        num(R.kpis.burnMultiple[m], 2), num(R.kpis.blendedCacPayback[m], 1)]);
    }
    app.appendChild(table(['m', 'Month', 'New ARR', 'Closing ARR', 'Customers', 'Revenue', 'Gross profit', 'EBITDA', 'Net income',
      'Net burn', 'Ending cash', 'Deferred revenue', 'Headcount', 'Utilization', 'Runway', 'Burn multiple', 'Blended CAC payback'], rows));

    app.appendChild(el('h2', '13-week cash forecast from ' + R.months[R.cash13.t0]));
    app.appendChild(table(['Week', 'Days', 'Receipts', 'Payroll and commissions', 'Vendors and capex', 'Debt service', 'Tax', 'Net cash flow', 'Ending cash'],
      R.cash13.weeks.map(function (w) {
        return [String(w.week), w.label, money(w.receipts), money(w.payrollAndCommissions), money(w.vendorsAndCapex), money(w.debtService),
          money(w.tax), money(w.net), money(w.endCash)];
      })));

    app.appendChild(el('h2', 'Integrity checks (baseline)'));
    app.appendChild(table(['Check', 'Name', 'Result', 'Reason'], res.checks.baseline.map(function (c) {
      return [c.id, c.name, c.pass ? 'pass' : 'FAIL', c.reason];
    })));
  }

  function main() {
    var res = Engine.evaluate(Engine.defaultAssumptions(), []);
    renderBadge(res);
    if (params.get('test') === '1') {
      var out = document.getElementById('test-output');
      out.hidden = false;
      var report = window.TestSuite.run();
      window.__TEST_RESULTS__ = report;
      out.textContent = window.TestSuite.format(report);
      document.title = (report.failed === 0 ? 'PASS ' : 'FAIL ') + report.passed + '/' + report.total;
      return;
    }
    renderApp(res);
  }
  try { main(); }
  catch (err) {
    window.__TEST_RESULTS__ = { error: String(err && err.stack || err) };
    var b = document.getElementById('badge'); b.textContent = 'Engine error: ' + err.message; b.style.color = 'red';
  }
})();
</script>
